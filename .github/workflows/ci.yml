name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      # Some tests exercise docker/*.sh under the real /bin/sh (dash on Ubuntu),
      # so this job must stay on Linux — those cases are skipped on Windows.
      - name: Test
        run: npm test
